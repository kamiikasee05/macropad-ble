        const KEYS = [

        // ==================== TEXTO -> KEYCODES HID ====================
        // Mapa: caracter -> {c: keycode HID, m: mods} (mayusculas/simbolos = shift)

        // Teclas especiales para agregar a la secuencia
        const SPECIAL_KEYS = [
            {n:"Enter",c:40},{n:"Esc",c:41},{n:"Backspace",c:42},{n:"Tab",c:43},{n:"Espacio",c:44},
            {n:"Caps Lock",c:57},{n:"Insert",c:73},{n:"Home",c:74},{n:"PageUp",c:75},{n:"Supr",c:76},{n:"Fin",c:77},{n:"PageDown",c:78},
            {n:"→",c:79},{n:"←",c:80},{n:"↓",c:81},{n:"↑",c:82},
            {n:"F1",c:58},{n:"F2",c:59},{n:"F3",c:60},{n:"F4",c:61},{n:"F5",c:62},{n:"F6",c:63},{n:"F7",c:64},{n:"F8",c:65},{n:"F9",c:66},{n:"F10",c:67},{n:"F11",c:68},{n:"F12",c:69}
        ];

        // ==================== API (HTTP local) ====================
        async function api(path, opts){
            const res = await fetch(path, opts);
            let data = null;
            const ct = res.headers.get('content-type') || '';
            if(ct.includes('application/json')){
                try { data = await res.json(); } catch(e){ data = null; }
            }
            if(!res.ok){
                const msg = (data && data.error) ? data.error : ('HTTP ' + res.status);
                throw new Error(msg);
            }
            return data;
        }
        function apiJson(path, method, body){
            return api(path, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
        }

        // ==================== ESTADO ====================
        // cada tecla: {N:true} | {K,c} | {M,c} | {A,mods,c} | {S,seq:[...]}
        let macData = Array.from({length:16}, () => ({K:true, c:4}));
        let editingIdx = null;
        let connected = false;

        const gridContainer = document.getElementById('keypad-grid');
        const drawer = document.getElementById('editor-drawer');
        const logEl = document.getElementById('log');
        const statusLed = document.getElementById('status-led');
        const connectLabel = document.getElementById('connect-label');
        const btnConnect = document.getElementById('btn-connect');
        const btnGet = document.getElementById('btn-get');
        const btnSet = document.getElementById('btn-set');
        const btnReset = document.getElementById('btn-reset');
        const profilesList = document.getElementById('profiles-list');
        const profilesPath = document.getElementById('profiles-path');
        const profileName = document.getElementById('profile-name');

        function log(m){ logEl.innerHTML += "&gt; " + escapeHtml(m) + "<br>"; logEl.scrollTop = logEl.scrollHeight; }
        function setStatus(state){
            // state: 'connected' | 'found' | 'off'
            if(state === 'connected') statusLed.className = 'w-3 h-3 rounded-full led-active bg-tertiary-fixed-dim text-tertiary-fixed-dim shadow-glow-green';
            else if(state === 'found') statusLed.className = 'w-3 h-3 rounded-full led-active bg-orange-400 text-orange-400';
            else statusLed.className = 'w-3 h-3 rounded-full led-active bg-error text-error';
        }
        function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        // ==================== SERIALIZACION ====================
        function keyToString(k){
            if(k.N) return "N";
            if(k.K) return "K:"+k.c;
            if(k.M) return "M:"+k.c;
            if(k.A) return "A:"+k.mods+":"+k.c;
            if(k.S) return "S:"+k.seq.map(x => x.m ? (x.m.toString(16).toUpperCase()+":"+x.c.toString(16).toUpperCase()) : x.c.toString(16).toUpperCase()).join(" ");
            return "N";
        }
        function keyLabel(k){
            if(k.N) return "—";
            if(k.K) return nameOf(KEYS, k.c) || ("#"+k.c);
            if(k.M) return nameOf(MEDIA_KEYS, k.c) || ("#"+k.c);
            if(k.A){
                const mods = MODS.filter(m=>k.mods&m.b).map(m=>m.n).join("+");
                return (mods?mods+"+":"") + (nameOf(KEYS, k.c) || ("#"+k.c));
            }
            if(k.S){
                // Mostrar los pasos como texto: caracteres normales + teclas especiales entre <>
                let s = "";
                for(const step of (k.seq||[])){
                    if(step.special) s += "<"+step.special+">";
                    else if(step.m && step.char) s += step.char;   // char ya incluye la mayuscula
                    else if(step.char) s += step.char;
                    else if(step.special) s += "<"+step.special+">";
                }
                return s || "Sec";
            }
            return "?";
        }
        function nameOf(arr, code){ const f = arr.find(x=>x.c===code); return f ? f.n : null; }
        function typeOf(k){ return k.N?"N":(k.K?"K":(k.M?"M":(k.A?"A":"S"))); }
        function typeClass(k){
            const t = typeOf(k);
            if(t==="K") return 'type-hid shadow-glow-cyan text-primary-fixed-dim';
            if(t==="A") return 'type-shortcut shadow-glow-purple text-secondary-fixed-dim';
            if(t==="M") return 'type-media shadow-glow-green text-tertiary-fixed-dim';
            if(t==="S") return 'type-sequence shadow-glow-orange text-orange-400';
            return 'opacity-40';
        }

        // ==================== RENDER GRID ====================
        function renderGrid(){
            gridContainer.innerHTML = "";
            for(let i=0;i<16;i++){
                const k = macData[i] || {N:true};
                const btn = document.createElement('button');
                btn.className = `keycap w-20 h-20 rounded-xl shadow-keycap flex flex-col items-center justify-center font-headline-md cursor-pointer ${typeClass(k)}`;
                btn.dataset.index = i;
                const small = document.createElement('span');
                small.className = 'text-[9px] font-label-mono opacity-60';
                small.textContent = 'K'+(i+1);
                const main = document.createElement('span');
                main.className = 'text-[13px] leading-tight px-1 text-center font-label-mono';
                main.textContent = keyLabel(k);
                btn.appendChild(small);
                btn.appendChild(main);
                btn.addEventListener('click', () => openEditor(i, btn));
                gridContainer.appendChild(btn);
            }
        }

        // ==================== EDITOR ====================
        function openEditor(index, btnEl){
            document.querySelectorAll('.keycap').forEach(b => b.classList.remove('ring-2', 'ring-white/50'));
            btnEl.classList.add('ring-2', 'ring-white/50');
            editingIdx = index;
            document.getElementById('editor-title').textContent = "Editar Tecla K" + (index+1);
            const k = macData[index];
            // set type buttons
            const t = typeOf(k);
            document.querySelectorAll('.type-btn').forEach(b => {
                const active = (b.dataset.type === (t==="N"?"none":t.toLowerCase()));
                b.className = b.className.replace(/border-primary-fixed-dim|bg-primary-fixed-dim\/10|border-tertiary-fixed-dim|border-secondary-fixed-dim|border-orange-400/g, '');
                if(t==="N") b.className = b.className.replace('border-outline-variant','border-outline-variant');
                b.classList.toggle('border-primary-fixed-dim', active && t!=="M" && t!=="A" && t!=="S");
                b.classList.toggle('bg-primary-fixed-dim/10', active && t!=="M" && t!=="A" && t!=="S");
                b.classList.toggle('border-tertiary-fixed-dim', active && t==="M");
                b.classList.toggle('border-secondary-fixed-dim', active && t==="A");
                b.classList.toggle('border-orange-400', active && t==="S");
            });
            // mods checkboxes
            const modsBox = document.getElementById('mods-box');
            modsBox.classList.toggle('hidden', t!=="A");
            document.querySelectorAll('input[data-mod]').forEach(cb => {
                cb.checked = (t==="A") && ((k.mods||0) & parseInt(cb.dataset.mod)) ? true : false;
            });
            // code select
            const codeBox = document.getElementById('code-box');
            const codeSelect = document.getElementById('code-select');
            const codeLabel = document.getElementById('code-label');
            const arr = (t==="M") ? MEDIA_KEYS : KEYS;
            codeSelect.innerHTML = arr.map(x=>`<option value="${x.c}">${x.n}</option>`).join("");
            codeSelect.value = String((t==="K"||t==="A") ? k.c : (t==="M" ? k.c : arr[0].c));
            codeLabel.textContent = (t==="M") ? "Acción Media" : "Keycode Base";
            codeBox.classList.remove('hidden');
            // seq
            const seqBox = document.getElementById('seq-box');
            seqBox.classList.toggle('hidden', t!=="S");
            if(t==="S"){
                seqInput.value = "";
                renderSeqChips(); updateSeqPreview();
            }
            if(t==="S") codeBox.classList.add('hidden');
            drawer.classList.remove('drawer-closed');
            drawer.classList.add('drawer-open');
        }

        function currentType(){
            const active = document.querySelector('.type-btn.border-primary-fixed-dim, .type-btn.border-tertiary-fixed-dim, .type-btn.border-secondary-fixed-dim, .type-btn.border-orange-400');
            if(active) return active.dataset.type;
            return 'hid';
        }

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const t = btn.dataset.type;
                const k = macData[editingIdx];
                if(t==="none") macData[editingIdx] = {N:true};
                else if(t==="hid") macData[editingIdx] = {K:true, c: (k.K?k.c:4)};
                else if(t==="media") macData[editingIdx] = {M:true, c: (k.M?k.c:MEDIA_KEYS[0].c)};
                else if(t==="shortcut") macData[editingIdx] = {A:true, mods: (k.A?k.mods:1), c: (k.A?k.c:4)};
                else if(t==="sequence") macData[editingIdx] = {S:true, seq: (k.S?k.seq:[])};
                openEditor(editingIdx, document.querySelector(`.keycap[data-index="${editingIdx}"]`));
            });
        });

        document.getElementById('code-select').addEventListener('change', e => {
            const c = parseInt(e.target.value);
            const k = macData[editingIdx];
            if(k.K) macData[editingIdx] = {K:true, c};
            else if(k.M) macData[editingIdx] = {M:true, c};
            else if(k.A) macData[editingIdx] = {A:true, mods:k.mods, c};
        });

        document.querySelectorAll('input[data-mod]').forEach(cb => {
            cb.addEventListener('change', () => {
                let m = 0;
                document.querySelectorAll('input[data-mod]').forEach(c => { if(c.checked) m |= parseInt(c.dataset.mod); });
                if(m===0) m = 1;
                macData[editingIdx] = {A:true, mods:m, c: macData[editingIdx].c||4};
            });
        });

        // ==================== SECUENCIA (texto + teclas especiales) ====================
        // k.seq = array de pasos: {c, m?, char?, special?}
        //   - paso de texto: {c: keycode, m: mods(opcional), char: "a"|"A"}
        //   - paso especial: {c: keycode, special: "Enter"|"Tab"|...}
        const seqInput = document.getElementById('seq-input');
        const seqSpecial = document.getElementById('seq-special');
        const seqChips = document.getElementById('seq-chips');
        const seqPreview = document.getElementById('seq-preview');

        // Llenar el select de teclas especiales
        seqSpecial.innerHTML = SPECIAL_KEYS.map(x=>`<option value="${x.c}">${x.n}</option>`).join("");

        // Convertir un string a pasos de secuencia (caracter por caracter)
        function textToSteps(text){
            const steps = [];
            for(const ch of text){
                const map = CHAR_MAP[ch];
                if(map) steps.push({c:map.c, m:map.m||0, char:ch});
                // si no esta en el mapa, ignorar (no se puede tipear)
            }
            return steps;
        }

        function renderSeqChips(){
            const k = macData[editingIdx];
            const steps = (k && k.S) ? k.seq : [];
            seqChips.innerHTML = "";
            steps.forEach((step, i) => {
                const chip = document.createElement('span');
                chip.className = 'inline-flex items-center gap-1 bg-surface-container border border-outline-variant/50 rounded px-2 py-1 font-label-mono text-label-mono text-on-surface';
                const label = step.special ? ("<"+step.special+">") : (step.char || ("0x"+step.c.toString(16).toUpperCase()));
                chip.innerHTML = `<span>${escapeHtml(label)}</span><button class="text-on-surface-variant hover:text-error transition-colors" data-rm="${i}">✕</button>`;
                seqChips.appendChild(chip);
            });
            seqChips.querySelectorAll('[data-rm]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const i = parseInt(btn.dataset.rm);
                    macData[editingIdx].seq.splice(i, 1);
                    renderSeqChips(); updateSeqPreview();
                });
            });
        }

        function updateSeqPreview(){
            const k = macData[editingIdx];
            const steps = (k && k.S) ? k.seq : [];
            seqPreview.textContent = steps.length
                ? "→ " + steps.map(s => s.special ? ("<"+s.special+">") : (s.char||"")).join("")
                : "";
        }

        // Agregar texto al final de la secuencia
        document.getElementById('seq-add').addEventListener('click', () => {
            const text = seqInput.value;
            if(!text) return;
            if(!macData[editingIdx].S) macData[editingIdx] = {S:true, seq:[]};
            macData[editingIdx].seq.push(...textToSteps(text));
            seqInput.value = "";
            renderSeqChips(); updateSeqPreview();
        });
        seqInput.addEventListener('keydown', e => {
            if(e.key === "Enter"){ e.preventDefault(); document.getElementById('seq-add').click(); }
        });

        // Agregar tecla especial
        document.getElementById('seq-add-special').addEventListener('click', () => {
            const c = parseInt(seqSpecial.value);
            if(!macData[editingIdx].S) macData[editingIdx] = {S:true, seq:[]};
            macData[editingIdx].seq.push({c, special: SPECIAL_KEYS.find(x=>x.c===c).n});
            renderSeqChips(); updateSeqPreview();
        });

        document.getElementById('btn-apply').addEventListener('click', () => {
            renderGrid();
            drawer.classList.remove('drawer-open');
            drawer.classList.add('drawer-closed');
            document.querySelectorAll('.keycap').forEach(b => b.classList.remove('ring-2', 'ring-white/50'));
        });

        document.getElementById('btn-close-drawer').addEventListener('click', () => {
            drawer.classList.remove('drawer-open');
            drawer.classList.add('drawer-closed');
            document.querySelectorAll('.keycap').forEach(b => b.classList.remove('ring-2', 'ring-white/50'));
        });

        // ==================== TRANSPORTE (HTTP /api) ====================
        async function refreshStatus(){
            try{
                const st = await api('/api/status');
                connected = !!st.connected;
                if(connected){
                    connectLabel.textContent = "DESCONECTAR";
                    setStatus('connected');
                } else {
                    connectLabel.textContent = "CONECTAR DISPOSITIVO";
                    setStatus(st.found ? 'found' : 'off');
                }
            } catch(e){
                connected = false;
                setStatus('off');
            }
        }

        btnConnect.addEventListener('click', async () => {
            try{
                if(connected){
                    log("Desconectando...");
                    await api('/api/disconnect', {method:'POST'});
                    log("Desconectado");
                } else {
                    log("Conectando (scan BLE)...");
                    const st = await api('/api/connect', {method:'POST'});
                    log("Conectado a " + (st.name||'MacropadFx') + " (" + (st.address||'') + ") ✓");
                }
            } catch(e){
                log("Error de conexión: " + e.message);
            }
            await refreshStatus();
        });

        function parseMapLine(line){
            const teclas = line.split('|');
            macData = [];
            for(let i=0;i<teclas.length;i++){
                const parts = teclas[i].split(':');
                const t = parts[0];
                if(t==="N") macData[i] = {N:true};
                else if(t==="K") macData[i] = {K:true, c:parseInt(parts[1])};
                else if(t==="M") macData[i] = {M:true, c:parseInt(parts[1])};
                else if(t==="A") macData[i] = {A:true, mods:parseInt(parts[1]), c:parseInt(parts[2])};
                else if(t==="S"){
                    // pasos separados por espacio; cada paso "mods:code" (hex) o "code" (hex)
                    // OJO: NO usar parts[1] — el ':' de los modificadores (ej "S:2:B ...")
                    // parte el string. Tomamos TODO lo que sigue al primer ':'.
                    const stepsStr = parts.slice(1).join(':');
                    const steps = stepsStr.trim().split(/\s+/).filter(Boolean).map(tok => {
                        const sep = tok.indexOf(':');
                        if(sep >= 0){
                            const m = parseInt(tok.slice(0,sep),16);
                            const c = parseInt(tok.slice(sep+1),16);
                            return {c, m: m||0};
                        }
                        return {c: parseInt(tok,16), m:0};
                    });
                    // Reconstruir el char cuando es una tecla simple (para mostrar en el grid)
                    steps.forEach(s => {
                        const ch = Object.keys(CHAR_MAP).find(k => CHAR_MAP[k].c===s.c && (CHAR_MAP[k].m||0)===s.m);
                        if(ch) s.char = ch;
                    });
                    macData[i] = {S:true, seq:steps};
                }
                else macData[i] = {N:true};
            }
            while(macData.length < 16) macData.push({N:true});
            macData = macData.slice(0, 16);
            renderGrid();
            log("Mapa cargado ✓ (" + macData.length + " teclas)");
        }

        async function loadKeymap(){
            try{
                log("Leyendo keymap (GET)...");
                const data = await api('/api/keymap');
                const raw = (data && data.raw) ? data.raw : '';
                log("RAW: " + raw.substring(0, 80) + (raw.length>80?"...":""));
                if(raw.includes('|')) parseMapLine(raw);
                else log("Respuesta inesperada: " + raw);
            } catch(e){ log("Error: " + e.message); }
            await refreshStatus();
        }
        btnGet.addEventListener('click', loadKeymap);

        async function saveKeymap(){
            try{
                const mapStr = macData.map(keyToString).join("|");
                log("Enviando: SETL " + mapStr.substring(0, 50) + "...");
                const data = await apiJson('/api/keymap', 'POST', {raw: mapStr});
                const raw = (data && data.raw) ? data.raw : '';
                if(normalize(raw) === normalize(mapStr)) log("✅ Guardado OK — verificado");
                else { log("⚠️ Verificación difiere; dispositivo responde:"); log(raw.substring(0,80)); if(raw.includes('|')) parseMapLine(raw); }
            } catch(e){ log("Error al guardar: " + e.message); }
            await refreshStatus();
        }
        btnSet.addEventListener('click', saveKeymap);

        function normalize(s){ return s.replace(/\s+/g,' ').trim(); }

        async function resetKeymap(){
            try{
                log("Restaurando default (RESET)...");
                const data = await api('/api/reset', {method:'POST'});
                const raw = (data && data.raw) ? data.raw : '';
                if(raw.includes('|')){ parseMapLine(raw); log("✅ Default restaurado"); }
                else log("Respuesta inesperada: " + raw);
            } catch(e){ log("Error al restaurar: " + e.message); }
            await refreshStatus();
        }
        btnReset.addEventListener('click', resetKeymap);

        // ==================== PERFILES ====================
        async function loadProfiles(){
            try{
                const data = await api('/api/profiles');
                if(data && data.path) profilesPath.textContent = data.path;
                renderProfiles((data && data.profiles) || {});
            } catch(e){ log("Error cargando perfiles: " + e.message); }
        }

        function renderProfiles(profiles){
            const names = Object.keys(profiles || {});
            if(!names.length){
                profilesList.innerHTML = '<div class="font-label-mono text-xs text-on-surface-variant opacity-60">Sin perfiles guardados.</div>';
                return;
            }
            profilesList.innerHTML = "";
            names.forEach(name => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 bg-surface rounded border border-outline-variant/40 px-3 py-2';
                const label = document.createElement('div');
                label.className = 'flex-1 min-w-0';
                label.innerHTML = `<div class="font-label-mono text-sm text-on-surface truncate">${escapeHtml(name)}</div>` +
                    `<div class="font-label-mono text-[10px] text-on-surface-variant opacity-60">${escapeHtml((profiles[name]||{}).saved_at||'')}</div>`;
                const apply = document.createElement('button');
                apply.className = 'px-3 py-1 bg-primary-fixed-dim/10 border border-primary-fixed-dim rounded text-primary-fixed-dim font-label-mono text-xs hover:bg-primary-fixed-dim/20 whitespace-nowrap transition-colors';
                apply.textContent = 'Aplicar';
                apply.addEventListener('click', () => applyProfile(name));
                const del = document.createElement('button');
                del.className = 'px-3 py-1 bg-error/10 border border-error/50 rounded text-error font-label-mono text-xs hover:bg-error/20 whitespace-nowrap transition-colors';
                del.textContent = 'Borrar';
                del.addEventListener('click', () => deleteProfile(name));
                row.appendChild(label); row.appendChild(apply); row.appendChild(del);
                profilesList.appendChild(row);
            });
        }

        async function saveCurrentProfile(){
            const name = (profileName.value || '').trim();
            if(!name){ log("⚠️ Escribí un nombre de perfil."); return; }
            try{
                const mapStr = macData.map(keyToString).join("|");
                await apiJson('/api/profiles', 'POST', {name, raw: mapStr});
                log("💾 Perfil guardado: " + name);
                profileName.value = "";
                await loadProfiles();
            } catch(e){ log("Error guardando perfil: " + e.message); }
        }
        document.getElementById('btn-profile-save').addEventListener('click', saveCurrentProfile);
        profileName.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); saveCurrentProfile(); } });

        async function applyProfile(name){
            try{
                log("Aplicando perfil: " + name);
                const data = await api('/api/profiles/' + encodeURIComponent(name) + '/apply', {method:'POST'});
                const raw = (data && data.raw) ? data.raw : '';
                if(raw.includes('|')){ parseMapLine(raw); log("✅ Perfil aplicado: " + name); }
                else log("Respuesta inesperada: " + raw);
            } catch(e){ log("Error aplicando perfil: " + e.message); }
            await refreshStatus();
        }

        async function deleteProfile(name){
            try{
                await api('/api/profiles/' + encodeURIComponent(name), {method:'DELETE'});
                log("🗑️ Perfil borrado: " + name);
                await loadProfiles();
            } catch(e){ log("Error borrando perfil: " + e.message); }
        }

        // ==================== INIT ====================
        renderGrid();
        loadProfiles();
        refreshStatus();
        setInterval(refreshStatus, 3000);
    </script>
</body></html>
